# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

- id: desktop-shell
  name: dsh-plugin-desktop
  config:
    mode: compatibility
    macosMaterial: transparent
    windowsMaterial: off
    openBrowser: false
    networkExposure: loopback
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
    titleBarScheme: auto
    titleBarPresetId: dsh-desktop
    titleBarCompat: false
    tabsEnabled:
      dsh-mnemon:memory: true

- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed

- id: dsh-catppuccin
  name: "@nonamelego/dsh-catppuccin"
  config:
    glass:
      enabled: true
      mode: mica
      blur: 12
      frost: 45
      brightness: 50
    flavor: catppuccin-latte
    autoCheck: true
    updateChannel: latest
    overrides: {}
    shikiStyle: italic-comments

# --- dsh-skin managed (auto-generated; do not edit) ---
- id: ui-skin-maid-atelier
  disabled: true
- id: ui-skin-orca-link
  disabled: false
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: dsh-context
  name: dsh-context
  config:
    defaultPlacement: all
    insightsEntry: hide
- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
      apiKey: ""
      protocol: auto
    memoryView:
      strategyTypeId: general
      entries:
        include:mnemon-strategy-default-three-tier:
          config: {}
        include:mnemon-strategy-general:
          config: {}
        include:mnemon-strategy-light-context:
          config: {}
        include:mnemon-strategy-scoped:
          config: {}
        include:mnemon-source-documents:
          config: {}
        include:mnemon-source-memory-spaces:
          config: {}
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000
    syncEnabled: true
- id: mnemon-strategy-general
  disabled: false
- id: mnemon-strategy-default-three-tier
  disabled: true
- id: mnemon-strategy-light-context
  disabled: false
- id: mnemon-strategy-scoped
  disabled: false
- id: mnemon-source-documents
  disabled: false
- id: mnemon-source-memory-spaces
  disabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high

# --- end dsh-skin managed ---

# --- session compress parms (based on practise experience in 2026-10-27 )---
# limit = floor(min(W*thresholdRatio, W - O - headroomTokens))
#   W = 1,000,000 (deepseek-v4-flash context window)
#   O = 256,000(maximal valid output)
#   default B=65,536 -> gateVal 678,464 left by words 0.16*(W-O) = 119,040
#   altered ->  727,616  0.22*(W-O) = 163,680
# maxTokens must declared, or it follows headroomTokens by default,
# won't suppressed to 16,384 that will narrow the summit output.
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    headroomTokens: 16384
    maxTokens: 65536
    retainRatio: 0.22